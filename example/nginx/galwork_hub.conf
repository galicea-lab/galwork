server {

    access_log /var/log/nginx/galwork_hub.access.log;
    error_log /var/log/nginx/galwork_hub.error.log;


  keepalive_timeout 90;

  client_max_body_size 32m;


  location / {
    #  API.
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }



    server_name galwork.example,com;



    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/galwork.example,com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/galwork.example,com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}server {
    if ($host = galwork.example,com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name galwork.example,com;
    listen 80;
    return 404; # managed by Certbot
}