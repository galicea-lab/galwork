server {
    server_name arena.example,com;

    location / {
        # AI 2026-11-15: edytory areny zapisują pliki obiegów przez API huba
        # (PUT /v1/wf/process-files/content, do 25 MB) - nginx domyślnie 1 MB.
        client_max_body_size 25m;
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhooks/long-running steps can take a while; avoid premature 504s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/arena.example,com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/arena.example,com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = arena.example,com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name arena.example,com;
    return 404; # managed by Certbot


}
