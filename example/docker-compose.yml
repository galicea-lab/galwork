# Minimalne wdrożenie produkcyjne: tylko galwork-hub (API) + galwork-arena 
# Baza danych NIE jest tu zarządzana - łączymy się do istniejącego PostgreSQL 
# (DATABASE_URL w .env). Parametry: skopiuj .env.example -> .env i wypełnij.
#
#   cp .env.example .env            # i wypełnij
#   docker compose pull
#   docker compose up -d
#
name: galwork

services:
  hub:
    image: registry.galicea.org/galwork-hub:0012
    env_file: .env
    ports:
      - "${HUB_PORT:-8000}:8000"
    # wspólny katalog definicji obiegów (BPMN + formularze)
    # zamiast kopii wypieczonej w obrazie. Hub czyta i zapisuje (edytory areny,
    # API /v1/wf/process-files); wersje draft tworzy
    # POST /v1/wf/process-models/sync-from-disk.
    volumes:
      - ${SPIFFWORKFLOW_DIR:?ustaw SPIFFWORKFLOW_DIR w .env}:/app/spiffworkflow
    restart: unless-stopped

  arena:
    image: registry.galicea.org/galwork-arena:0010
    environment:
      HUB_UPSTREAM: ${HUB_UPSTREAM:-http://hub:8000}
    ports:
      - "${ARENA_PORT:-8081}:80"
    depends_on:
      - hub
    restart: unless-stopped

