server {
	root /var/www/galicea/centrum;
	index index.html;
	server_name centrum.galicea.org;
	access_log /var/log/nginx/centrum-galicea-org.access.log;
	error_log /var/log/nginx/centrum-galicea-org.error.log;
	location / {
		# First attempt to serve request as file, then
		# as directory, then fall back to displaying a 404.
		try_files $uri $uri/ =404;
	}
	listen 80;
	listen [::]:80;
}