server {

    server_name docs.transmem.pl;

    access_log /var/log/nginx/docs.access.log;
    error_log /var/log/nginx/docs.error.log;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;

        # Required for the app's Socket.IO connection (worker <-> app, live run updates).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhooks/long-running steps can take a while; avoid premature 504s.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }



    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/docs.transmem.pl/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/docs.transmem.pl/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = docs.transmem.pl) {
        return 301 https://$host$request_uri;
    } # managed by Certbot



    server_name docs.transmem.pl;
    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}