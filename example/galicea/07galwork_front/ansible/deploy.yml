---
- name: Budowa i pakowanie aplikacji galwork
  hosts: galwork
  connection: local
  gather_facts: false
  run_once: true
  vars_files:
    - group_vars/galwork.yml
  tags:
    - build
  tasks:
    - name: Utworzenie katalogu artefaktów
      ansible.builtin.file:
        path: "{{ artifacts_dir }}"
        state: directory
        mode: "0755"

    - name: Kopiowanie plików .env do repozytoriów aplikacji
      ansible.builtin.copy:
        src: "{{ env_dir }}/{{ item.env_file }}"
        dest: "{{ repo_root }}/{{ item.source_dir }}/.env.production"
        mode: "0600"
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Instalacja zależności JS
      ansible.builtin.command:
        cmd: yarn install --frozen-lockfile
        chdir: "{{ repo_root }}/{{ item.source_dir }}"
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"
      when: install_dependencies | bool

    - name: Budowanie aplikacji
      ansible.builtin.command:
        cmd: yarn build
        chdir: "{{ repo_root }}/{{ item.source_dir }}"
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Przygotowanie katalogu static w standalone
      ansible.builtin.file:
        path: "{{ repo_root }}/galwork-pm/.next/standalone/.next/static"
        state: directory
        mode: "0755"

    - name: Kopiowanie static do standalone
      ansible.builtin.copy:
        src: "{{ repo_root }}/galwork-pm/.next/static/"
        dest: "{{ repo_root }}/galwork-pm/.next/standalone/.next/static/"
        remote_src: true

    - name: Kopiowanie public do standalone
      ansible.builtin.copy:
        src: "{{ repo_root }}/galwork-pm/public/"
        dest: "{{ repo_root }}/galwork-pm/.next/standalone/public/"
        remote_src: true

    - name: Kopiowanie .env.production do standalone
      ansible.builtin.copy:
        src: "{{ repo_root }}/galwork-pm/.env.production"
        dest: "{{ repo_root }}/galwork-pm/.next/standalone/.env.production"
        remote_src: true
        mode: "0600"

    - name: Pakowanie artefaktów
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ artifacts_dir }}/{{ item.name }}.tar.gz"
          - -C
          - "{{ item.build_dir }}"
          - .
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

- name: Wdrożenie aplikacji galwork na serwerze
  hosts: galwork
  become: true
  gather_facts: false
  vars_files:
    - group_vars/galwork.yml
  tags:
    - deploy
  tasks:
    - name: Instalacja nginx
      ansible.builtin.package:
        name: nginx
        state: present
      when: install_nginx | bool

    - name: Utworzenie katalogów serwerowych
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /var/www/galicea
        - "{{ artifacts_remote_dir }}"
        - "{{ releases_dir }}"

    - name: Utworzenie katalogu konfiguracji nginx
      ansible.builtin.file:
        path: /etc/nginx/conf.d
        state: directory
        mode: "0755"
      when: manage_nginx | bool

    - name: Przesłanie artefaktów na serwer
      ansible.builtin.copy:
        src: "{{ artifacts_dir }}/{{ item.name }}.tar.gz"
        dest: "{{ artifacts_remote_dir }}/{{ item.name }}.tar.gz"
        mode: "0644"
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Ustalenie identyfikatora wydania
      ansible.builtin.set_fact:
        release_id: "{{ lookup('pipe', 'date +%Y%m%d%H%M%S') }}"

    - name: Odczyt aktualnych katalogów docelowych
      ansible.builtin.stat:
        path: "{{ item.target_dir }}"
        follow: false
      register: target_stat
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Sprawdzenie czy katalogi docelowe są symlinkami
      ansible.builtin.fail:
        msg: "{{ item.item.target_dir }} musi być symlinkiem albo nie może istnieć"
      loop: "{{ target_stat.results }}"
      when: item.stat.exists and not (item.stat.islnk | default(false) | bool)

    - name: Zapamiętanie poprzedniego wydania
      ansible.builtin.file:
        src: "{{ target_stat.results[app_idx].stat.lnk_source }}"
        dest: "/var/www/galicea/{{ item.name }}-previous"
        state: link
        force: true
      loop: "{{ apps }}"
      loop_control:
        index_var: app_idx
        label: "{{ item.name }}"
      when: target_stat.results[app_idx].stat.islnk | default(false) | bool

    - name: Utworzenie katalogów nowego wydania
      ansible.builtin.file:
        path: "{{ releases_dir }}/{{ item.name }}-{{ release_id }}"
        state: directory
        mode: "0755"
        owner: www-data
        group: www-data
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Rozpakowanie nowego wydania
      ansible.builtin.unarchive:
        src: "{{ artifacts_remote_dir }}/{{ item.name }}.tar.gz"
        dest: "{{ releases_dir }}/{{ item.name }}-{{ release_id }}"
        remote_src: true
        owner: www-data
        group: www-data
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Odczyt ścieżki do node
      ansible.builtin.command: which node
      register: node_path
      changed_when: false

    - name: Zapisanie ścieżki do node
      ansible.builtin.set_fact:
        node_bin: "{{ node_path.stdout }}"

    - name: Instalacja jednostki systemd dla PM
      ansible.builtin.template:
        src: galwork-pm.service.j2
        dest: "/etc/systemd/system/{{ pm_app.service_name }}.service"
        mode: "0644"
      notify: restart galwork-pm

    - name: Konfiguracja nginx dla PM
      ansible.builtin.template:
        src: nginx-pm.conf.j2
        dest: /etc/nginx/conf.d/galwork-pm.conf
        mode: "0644"
      notify: reload nginx
      when: manage_nginx | bool

    - name: Konfiguracja nginx dla stron statycznych
      ansible.builtin.template:
        src: nginx-static.conf.j2
        dest: "/etc/nginx/conf.d/{{ item.name }}.conf"
        mode: "0644"
      loop: "{{ static_apps }}"
      loop_control:
        label: "{{ item.name }}"
      notify: reload nginx
      when: manage_nginx | bool

    - name: Sprawdzenie konfiguracji nginx
      ansible.builtin.command: nginx -t
      changed_when: false
      when: manage_nginx | bool

    - name: Przełączenie katalogów na nowe wydanie
      ansible.builtin.file:
        src: "{{ releases_dir }}/{{ item.name }}-{{ release_id }}"
        dest: "{{ item.target_dir }}"
        state: link
        force: true
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"
      notify:
        - restart galwork-pm
        - reload nginx

    - name: Usunięcie starych wydań
      ansible.builtin.shell: |
        find "{{ releases_dir }}" -maxdepth 1 -type d -name "{{ item.name }}-*" -printf '%T@ %p\n' \
          | sort -rn \
          | tail -n +{{ (keep_releases | int) + 1 }} \
          | cut -d' ' -f2- \
          | xargs -r rm -rf
      loop: "{{ apps }}"
      loop_control:
        label: "{{ item.name }}"
      changed_when: false

  handlers:
    - name: restart galwork-pm
      ansible.builtin.systemd_service:
        name: "{{ pm_app.service_name }}"
        daemon_reload: true
        enabled: true
        state: restarted

    - name: reload nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: manage_nginx | bool
