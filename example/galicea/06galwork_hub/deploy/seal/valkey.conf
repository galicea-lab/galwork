# AI 2026-11-06: instancja Valkey usługi pieczęci (osobna od cache huba).
# Przenosi zlecenia (podpisane atrybuty CMS ze skrótem dokumentu), odpowiedzi
# (podpisy), certyfikaty publiczne i dziennik - nigdy kluczy prywatnych.
port 6379
bind 0.0.0.0
protected-mode yes
aclfile /etc/valkey/users.acl
# zlecenia w toku i dziennik przetrwają restart
appendonly yes
dir /data
# dziennik nie może znikać po cichu przy braku pamięci
maxmemory 256mb
maxmemory-policy noeviction
# Poza siecią wewnętrzną Dockera włącz TLS:
# port 0
# tls-port 6379
# tls-cert-file /etc/valkey/tls/server.crt
# tls-key-file /etc/valkey/tls/server.key
# tls-ca-cert-file /etc/valkey/tls/ca.crt
# tls-auth-clients optional
